name: Apply V6.4 Gameplay Reboot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-v64.yml"
      - ".v64/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct V6.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v64/part_*.b64 > /tmp/v64.b64
          base64 --decode /tmp/v64.b64 > /tmp/v64.zip
          rm -rf /tmp/v64
          mkdir -p /tmp/v64
          unzip -q /tmp/v64.zip -d /tmp/v64
          test -f /tmp/v64/VERSION.txt
          test -f /tmp/v64/games/character-kit.js
          test -f /tmp/v64/games/mobile-controls.js

      - name: Overlay reboot onto deployed source
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/v64/. src/
          # Preserve the real-account / shared-matchmaking layer from V6.3.
          test -f src/online.js
          test -f src/online.css
          test -f src/online-config.js
          test -f supabase/migrations/001_accounts_matchmaking.sql

      - name: Mark combined build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/launch-config.js")
          s=p.read_text()
          s=s.replace("build: 'V6.3-online-beta'","build: 'V6.4-online-beta'")
          s=s.replace("build: 'V6.2'","build: 'V6.4-online-beta'")
          p.write_text(s)
          PY

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          python3 src/qa_release.py
          grep -q "const PLAYER_COUNT=12" src/games/falling-tiles/game.js
          grep -q "const PLAYER_COUNT=12" src/games/meteor-dodge/game.js
          grep -q "character-kit.js" src/games/obstacle-sprint/index.html
          grep -q "mobile-controls.js" src/games/obstacle-sprint/index.html

      - name: Commit V6.4 reboot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Skill Arcade V6.4 gameplay reboot"
            git push
          fi
